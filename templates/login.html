<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fdf6f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(circle at 10% 20%, #fde8e8 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, #e8f0e8 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #f0e8ff 0%, transparent 60%);
    }

    .login-card {
      background: #fffaf7;
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: 0 8px 40px rgba(180,120,120,0.15);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid rgba(232,180,184,0.2);
    }

    .tag {
      display: inline-block;
      background: linear-gradient(135deg, #e8b4b8, #9b6bf0);
      color: white;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      color: #3d2c2c;
      margin-bottom: 8px;
    }

    p {
      color: #b89a9a;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      font-size: 12px;
      color: #7a5c5c;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      display: block;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid #f0dede;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: #3d2c2c;
      background: #fdf6f0;
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus {
      border-color: #e8b4b8;
      box-shadow: 0 0 0 3px rgba(232,180,184,0.15);
    }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #e8b4b8, #9b6bf0);
      color: white;
      border: none;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(155,107,240,0.35);
    }

    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #b89a9a;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="tag">✨ My Finance</div>
    <h1>Expense Tracker</h1>
    <p>Enter your name to get started 🌸</p>

    <form action="/" method="POST">
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" name="username" placeholder="Ex: Gayathri..." required>
      </div>
      <div class="input-group">
        <label>Monthly Budget (₹)</label>
        <input type="number" name="budget" placeholder="Ex: 10000">
      </div>
      <button type="submit" class="btn-login">Let's Go! 🚀</button>
    </form>

    <div class="hint">💡 Each person's data is saved separately!</div>
  </div>
</body>
</html>
